<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark premium background -->
  <rect width="800" height="500" fill="#0c0c0c"/>
  
  <!-- Ambient lighting/glows -->
  <circle cx="400" cy="250" r="300" fill="#d4af37" fill-opacity="0.02" filter="blur(80px)"/>
  <circle cx="250" cy="200" r="150" fill="#3b82f6" fill-opacity="0.03" filter="blur(60px)"/>

  <!-- Lab bench surface -->
  <path d="M 50 420 L 750 420 L 700 480 L 100 480 Z" fill="#141414" opacity="0.8"/>
  <line x1="50" y1="420" x2="750" y2="420" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  
  <!-- Spectrometer/Analyzer Machine Body -->
  <!-- Main chassis shadow -->
  <rect x="180" y="130" width="440" height="280" rx="12" fill="#000000" opacity="0.5" filter="blur(10px)"/>
  
  <!-- Main chassis -->
  <rect x="180" y="120" width="440" height="280" rx="8" fill="#1e1e1e" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <!-- Front metal panel (brushed aluminum style) -->
  <rect x="195" y="135" width="410" height="250" rx="4" fill="#262626" stroke="#ffffff" stroke-opacity="0.05"/>
  
  <!-- Left Side: Laser/Optical Chamber (glowing dark glass door) -->
  <rect x="215" y="155" width="160" height="210" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>
  <!-- Glass reflection -->
  <path d="M 215 155 L 320 155 L 215 320 Z" fill="#ffffff" fill-opacity="0.02"/>
  
  <!-- Inside Optical Chamber (visible through glass) -->
  <!-- Laser Emitter (Gold/brass nozzle) -->
  <rect x="230" y="245" width="20" height="30" rx="2" fill="#8c7853"/>
  <rect x="250" y="255" width="10" height="10" fill="#d4af37"/>
  
  <!-- Laser Beam (Glowing Red Line) -->
  <line x1="260" y1="260" x2="330" y2="260" stroke="#ff3333" stroke-width="2" stroke-linecap="round"/>
  <line x1="260" y1="260" x2="330" y2="260" stroke="#ff3333" stroke-width="6" stroke-opacity="0.3" stroke-linecap="round" filter="blur(1px)"/>
  
  <!-- Glass Cuvette (Sample Holder) -->
  <rect x="285" y="220" width="20" height="80" rx="1" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.4"/>
  <!-- Liquid/Slurry inside cuvette (white clay particles) -->
  <rect x="287" y="235" width="16" height="63" fill="#ffffff" fill-opacity="0.15"/>
  <circle cx="292" cy="245" r="1.5" fill="#ffffff" fill-opacity="0.8"/>
  <circle cx="298" cy="255" r="1" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="290" cy="265" r="2" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="296" cy="275" r="1.2" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="293" cy="285" r="1.8" fill="#ffffff" fill-opacity="0.8"/>
  
  <!-- Laser diffraction sparkles (after passing cuvette) -->
  <path d="M 305 260 L 335 245 M 305 260 L 335 260 M 305 260 L 335 275" stroke="#ff3333" stroke-width="1" stroke-opacity="0.6"/>
  
  <!-- Optical Sensor/Receiver -->
  <rect x="330" y="245" width="25" height="30" rx="2" fill="#1f2937" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="342" cy="260" r="4" fill="#111827"/>
  
  <!-- Inside Chamber internal light -->
  <circle cx="295" cy="260" r="45" fill="#3b82f6" fill-opacity="0.1" filter="blur(15px)"/>
  
  <!-- Right Side: Integrated Control Screen -->
  <rect x="395" y="155" width="195" height="150" rx="4" fill="#09090b" stroke="#ffffff" stroke-opacity="0.1"/>
  
  <!-- Mini Chart on Screen -->
  <path d="M 410 270 Q 450 265 480 200 T 540 180 T 570 175" fill="none" stroke="#d4af37" stroke-width="2"/>
  <path d="M 410 270 Q 450 265 480 200 T 540 180 T 570 175 L 570 280 L 410 280 Z" fill="#d4af37" fill-opacity="0.05"/>
  <!-- Grid lines on screen -->
  <line x1="410" y1="280" x2="570" y2="280" stroke="#ffffff" stroke-opacity="0.1"/>
  <line x1="410" y1="280" x2="410" y2="170" stroke="#ffffff" stroke-opacity="0.1"/>
  <line x1="450" y1="280" x2="450" y2="170" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="2 2"/>
  <line x1="490" y1="280" x2="490" y2="170" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="2 2"/>
  <line x1="530" y1="280" x2="530" y2="170" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="2 2"/>
  
  <text x="415" y="185" fill="#d4af37" font-family="monospace" font-size="8" font-weight="bold">D50: 4.82 µm</text>
  <text x="415" y="198" fill="#3b82f6" font-family="monospace" font-size="7">SMC-902 STATUS: OK</text>
  
  <!-- Control Buttons & Knobs under screen -->
  <circle cx="415" cy="340" r="8" fill="#1f2937" stroke="#ffffff" stroke-opacity="0.2"/>
  <line x1="415" y1="340" x2="411" y2="334" stroke="#d4af37" stroke-width="2"/>
  
  <circle cx="440" cy="340" r="8" fill="#1f2937" stroke="#ffffff" stroke-opacity="0.2"/>
  <line x1="440" y1="340" x2="445" y2="345" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
  
  <!-- Status LEDs -->
  <circle cx="535" cy="340" r="4" fill="#10b981"/>
  <circle cx="535" cy="340" r="6" fill="#10b981" fill-opacity="0.4" filter="blur(1px)"/>
  <text x="547" y="343" fill="#8c8c8c" font-family="sans-serif" font-size="8" letter-spacing="1">READY</text>
  
  <circle cx="490" cy="340" r="4" fill="#3b82f6"/>
  <circle cx="490" cy="340" r="6" fill="#3b82f6" fill-opacity="0.4" filter="blur(1px)"/>
  <text x="502" y="343" fill="#8c8c8c" font-family="sans-serif" font-size="8" letter-spacing="1">LASER</text>

  <!-- Brand label on machine -->
  <text x="395" y="375" fill="#ffffff" fill-opacity="0.2" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="3">SARATHI MICRON</text>
  <text x="545" y="375" fill="#ffffff" fill-opacity="0.1" font-family="sans-serif" font-size="8" letter-spacing="1">LPA-300</text>

  <!-- Background Lab Accessories (shelves, beaker silhouettes, very subtle) -->
  <rect x="80" y="150" width="60" height="6" fill="#1f2937" opacity="0.3"/>
  <!-- Beaker silhouette -->
  <path d="M 95 150 L 95 130 L 100 130 L 100 128 L 90 128 L 90 130 L 95 130 Z" fill="#1f2937" opacity="0.2"/>
  <rect x="110" y="132" width="15" height="18" fill="#1f2937" opacity="0.2"/>
  
  <rect x="660" y="180" width="70" height="6" fill="#1f2937" opacity="0.3"/>
  <rect x="680" y="155" width="20" height="25" fill="#1f2937" opacity="0.2"/>

  <!-- Top Title Overlay -->
  <text x="400" y="55" fill="#ffffff" font-family="sans-serif" font-weight="300" font-size="16" letter-spacing="4" text-anchor="middle">LASER PARTICLE SIZE ANALYZER</text>
  <text x="400" y="75" fill="#d4af37" font-family="sans-serif" font-size="9" letter-spacing="2" text-anchor="middle">HIGH-PRECISION QUALITY CONTROL SYSTEM</text>
</svg>
