<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark futuristic background -->
  <rect width="800" height="500" fill="#0d0d0d"/>
  
  <!-- Subtle gold glow on top-right -->
  <circle cx="700" cy="100" r="250" fill="#d4af37" fill-opacity="0.03" filter="blur(80px)"/>
  <circle cx="100" cy="400" r="200" fill="#8c7853" fill-opacity="0.02" filter="blur(80px)"/>
  
  <!-- Main Grid Area -->
  <g opacity="0.15">
    <line x1="100" y1="100" x2="100" y2="400" stroke="#d4af37" stroke-width="1"/>
    <line x1="100" y1="400" x2="700" y2="400" stroke="#d4af37" stroke-width="1"/>
    
    <!-- Grid Lines -->
    <line x1="200" y1="100" x2="200" y2="400" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="300" y1="100" x2="300" y2="400" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="400" y1="100" x2="400" y2="400" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="500" y1="100" x2="500" y2="400" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="600" y1="100" x2="600" y2="400" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="700" y1="100" x2="700" y2="400" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 4"/>
    
    <line x1="100" y1="350" x2="700" y2="350" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="100" y1="300" x2="700" y2="300" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="100" y1="250" x2="700" y2="250" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="100" y1="200" x2="700" y2="200" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="100" y1="150" x2="700" y2="150" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="100" y1="100" x2="700" y2="100" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 4"/>
  </g>
  
  <!-- Axis Labels -->
  <text x="100" y="425" fill="#8c8c8c" font-family="monospace" font-size="10" text-anchor="middle">0.1</text>
  <text x="200" y="425" fill="#8c8c8c" font-family="monospace" font-size="10" text-anchor="middle">0.5</text>
  <text x="300" y="425" fill="#8c8c8c" font-family="monospace" font-size="10" text-anchor="middle">1.0</text>
  <text x="400" y="425" fill="#8c8c8c" font-family="monospace" font-size="10" text-anchor="middle">5.0</text>
  <text x="500" y="425" fill="#8c8c8c" font-family="monospace" font-size="10" text-anchor="middle">10.0</text>
  <text x="600" y="425" fill="#8c8c8c" font-family="monospace" font-size="10" text-anchor="middle">50.0</text>
  <text x="700" y="425" fill="#8c8c8c" font-family="monospace" font-size="10" text-anchor="middle">100.0</text>
  
  <text x="80" y="405" fill="#8c8c8c" font-family="monospace" font-size="10" text-anchor="end">0%</text>
  <text x="80" y="305" fill="#8c8c8c" font-family="monospace" font-size="10" text-anchor="end">50%</text>
  <text x="80" y="205" fill="#8c8c8c" font-family="monospace" font-size="10" text-anchor="end">100%</text>
  
  <text x="400" y="455" fill="#d4af37" font-family="sans-serif" font-size="11" tracking="1" text-anchor="middle" letter-spacing="2">PARTICLE SIZE DISTRIBUTION (DIAMETER, µm)</text>
  <text x="50" y="250" fill="#d4af37" font-family="sans-serif" font-size="11" tracking="1" text-anchor="middle" transform="rotate(-90 50 250)" letter-spacing="2">CUMULATIVE PASSING (%)</text>
  
  <!-- Gradients for Curve Fills -->
  <defs>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="bronze-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8c7853" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8c7853" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  
  <!-- Filled areas under curves -->
  <path d="M 100 400 Q 250 395 350 300 T 550 120 T 700 100 L 700 400 Z" fill="url(#gold-grad)"/>
  <path d="M 100 400 Q 280 398 380 340 T 580 180 T 700 150 L 700 400 Z" fill="url(#bronze-grad)"/>
  
  <!-- Curve Lines -->
  <!-- Target Specification -->
  <path d="M 100 400 Q 280 398 380 340 T 580 180 T 700 150" fill="none" stroke="#8c7853" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Current Batch Analysis -->
  <path d="M 100 400 Q 250 395 350 300 T 550 120 T 700 100" fill="none" stroke="#d4af37" stroke-width="2.5"/>
  
  <!-- Data Callouts / Panel -->
  <rect x="520" y="45" width="220" height="150" rx="6" fill="#141414" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  
  <text x="540" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">BATCH ANALYSIS REPORT</text>
  
  <text x="540" y="95" fill="#8c8c8c" font-family="sans-serif" font-size="10">SAMPLE ID: SMC-902_QC</text>
  <text x="540" y="115" fill="#8c8c8c" font-family="sans-serif" font-size="10">MATERIAL: Refined China Clay</text>
  
  <text x="540" y="145" fill="#ffffff" font-family="monospace" font-size="10">D10: 1.18 µm</text>
  <text x="640" y="145" fill="#d4af37" font-family="monospace" font-size="10" font-weight="bold">PASS</text>
  
  <text x="540" y="165" fill="#ffffff" font-family="monospace" font-size="10">D50: 4.82 µm</text>
  <text x="640" y="165" fill="#d4af37" font-family="monospace" font-size="10" font-weight="bold">PASS</text>
  
  <text x="540" y="185" fill="#ffffff" font-family="monospace" font-size="10">D90: 12.35 µm</text>
  <text x="640" y="185" fill="#d4af37" font-family="monospace" font-size="10" font-weight="bold">PASS</text>
  
  <!-- Laser Beam Graphic (representing the analysis technique) -->
  <g transform="translate(120, 45)">
    <rect width="360" height="45" rx="4" fill="#141414" stroke="#ffffff" stroke-opacity="0.08"/>
    <!-- Laser emitter -->
    <rect x="10" y="12" width="25" height="20" rx="2" fill="#333"/>
    <circle cx="35" cy="22" r="3" fill="#ff3333"/>
    <!-- Laser receiver -->
    <rect x="325" y="12" width="25" height="20" rx="2" fill="#333"/>
    <!-- Laser line -->
    <line x1="35" y1="22" x2="325" y2="22" stroke="#ff3333" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Sample cuvette -->
    <rect x="170" y="5" width="20" height="35" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.3"/>
    <!-- Floating particles inside cuvette -->
    <circle cx="178" cy="12" r="1" fill="#d4af37"/>
    <circle cx="184" cy="18" r="1.5" fill="#d4af37"/>
    <circle cx="176" cy="24" r="1" fill="#d4af37"/>
    <circle cx="182" cy="30" r="2" fill="#d4af37"/>
    <circle cx="174" cy="16" r="1.2" fill="#d4af37"/>
    <!-- Diffraction wave lines -->
    <path d="M 195 22 Q 220 12 250 10 M 195 22 Q 220 22 250 22 M 195 22 Q 220 32 250 34" fill="none" stroke="#ff3333" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="70" y="26" fill="#8c8c8c" font-family="sans-serif" font-size="9" letter-spacing="1">QC LASER DIFFRACTION SYSTEM</text>
  </g>
  
  <!-- Top Title Bar -->
  <text x="100" y="32" fill="#ffffff" font-family="sans-serif" font-weight="300" font-size="14" letter-spacing="3">SARATHI MICRON QUALITY LAB</text>
  <text x="700" y="32" fill="#d4af37" font-family="sans-serif" font-size="9" text-anchor="end" letter-spacing="1">SYSTEM READY</text>
</svg>
